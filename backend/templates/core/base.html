<style id="medicare-redesign">
:root {
    --navy:#0b2450;
    --navy2:#102f66;
    --accent:#245df5;
    --accent2:#1d4ed8;
    --bg:#f4f7fc;
    --text:#152a4c;
    --muted:#64748b;
    --border:#e2e8f0;
}
body {background:var(--bg);color:var(--text)}
.sidebar {
    width:245px;
    background:linear-gradient(180deg,#0a234e,#102f66);
    padding:24px 14px;
}
.brand {font-size:25px;letter-spacing:-.6px}
.nav-link {border-radius:8px;padding:13px 16px}
.nav-link:hover,.nav-link.active {
    background:#2563eb;
    color:white;
    box-shadow:none;
}
.topbar {
    padding:21px 30px;
    background:white;
    box-shadow:0 1px 5px #102a5010;
}
.content {max-width:none;padding:30px}
.page-title {color:#10254d;font-size:28px}
.subtitle {color:#64748b}
.hero {
    background:linear-gradient(110deg,#102f66,#245df5);
    border-radius:14px;
}
.hero:after {display:none}
.stats {grid-template-columns:repeat(3,minmax(0,1fr))}
.stat-card,.panel {
    border:1px solid #e2e8f0;
    border-radius:12px;
    box-shadow:0 4px 15px #102a500a;
}
.stat-card {padding:24px}
.stat-icon {display:none!important}
.stat-label {font-size:14px;color:#64748b}
.stat-value {color:#1d4ed8}
.quick-link {
    border-radius:9px;
    background:#f8fbff;
    padding:20px;
}
.quick-link span {display:none}
.panel-header {padding:22px 25px}
.panel-header h2 {color:#10254d}
.action {
    background:#245df5;
    color:white;
    border-radius:7px;
    padding:11px 18px;
}
.action:hover {background:#1d4ed8;color:white}
table {min-width:680px}
th {
    background:#edf3ff;
    color:#334766;
    padding:15px 17px;
}
td {padding:16px 17px}
td:first-child {color:#245df5}
tbody tr:hover {background:#f7faff}
.medicare-toolbar {
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    padding:18px 22px;
    border-bottom:1px solid #e2e8f0;
}
.medicare-search {
    flex:1;
    min-width:200px;
    border:1px solid #d6dfec;
    border-radius:8px;
    padding:12px 15px;
    font:inherit;
    outline:none;
}
.medicare-search:focus {border-color:#245df5}
.medicare-button {
    display:inline-block;
    background:#245df5;
    color:white;
    border-radius:7px;
    padding:11px 16px;
    font-size:13px;
    font-weight:650;
    text-decoration:none;
}
.medicare-button:hover {background:#1d4ed8;color:white}
.medicare-button.secondary {
    background:#eaf0ff;
    color:#2452c5;
}
.medicare-button.danger {
    background:#fff0f0;
    color:#c62828;
}
.medicare-actions {display:flex;gap:7px;white-space:nowrap}
.medicare-actions .medicare-button {padding:7px 11px}
.medicare-empty {
    padding:20px;
    text-align:center;
    color:#64748b;
}
@media(max-width:1050px) {
    .sidebar {width:210px}
}
@media(max-width:700px) {
    .sidebar {width:100%}
    .stats {grid-template-columns:1fr}
    .content {padding:18px}
    .medicare-toolbar {align-items:stretch}
    .medicare-search {width:100%}
}
</style>

</head><body><div class="layout"><aside class="sidebar"><a class="brand" href="/">MediCare</a><div class="side-label">ĐIỀU HƯỚNG</div><nav class="nav"><a class="nav-link {% if active_page == 'trang_chu' %}active{% endif %}" href="/">Tổng quan</a>
<a class="nav-link {% if active_page == 'bac_si' %}active{% endif %}" href="/bac-si/">Bác sĩ</a>
<a class="nav-link {% if active_page == 'benh_nhan' %}active{% endif %}" href="/benh-nhan/">Bệnh nhân</a>
<a class="nav-link {% if active_page == 'lich_kham' %}active{% endif %}" href="/lich-kham/">Lịch khám</a>
<a class="nav-link {% if active_page == 'ho_so' %}active{% endif %}" href="/ho-so/">Hồ sơ bệnh án</a>
<a class="nav-link {% if active_page == 'thuoc' %}active{% endif %}" href="/thuoc/">Kho thuốc</a>
<a class="nav-link {% if active_page == 'don_thuoc' %}active{% endif %}" href="/don-thuoc/">Đơn thuốc</a>
<a class="nav-link {% if active_page == 'chi_tiet_don_thuoc' %}active{% endif %}" href="/chi-tiet-don-thuoc/">Chi tiết đơn thuốc</a></nav><div class="sidebar-footer">MediCare | Quản lý bệnh viện</div></aside><div class="main"><header class="topbar"><div class="crumb">MediCare / <strong>{% block breadcrumb %}Tổng quan{% endblock %}</strong></div><span class="top-pill">Đang hoạt động</span></header><main class="content">{% block content %}{% endblock %}<div class="footer-note">© MediCare | Giao diện quản lý bệnh viện</div></main></div></div>
<script id="medicare-redesign-js">
document.addEventListener("DOMContentLoaded", function () {
    const models = {
        "/bac-si/": "bacsi",
        "/benh-nhan/": "benhnhan",
        "/lich-kham/": "lichkham",
        "/ho-so/": "hosobenhan",
        "/thuoc/": "thuoc",
        "/don-thuoc/": "donthuoc",
        "/chi-tiet-don-thuoc/": "chitietdonthuoc"
    };

    const model = models[window.location.pathname];
    if (!model) return;

    const table = document.querySelector(".content table");
    if (!table) return;

    const panel = table.closest(".panel");
    const scroll = table.closest(".table-scroll") || table.parentElement;
    if (!panel || !scroll) return;

    const adminBase = "/admin/core/" + model + "/";
    const toolbar = document.createElement("div");
    toolbar.className = "medicare-toolbar";

    const search = document.createElement("input");
    search.type = "search";
    search.className = "medicare-search";
    search.placeholder = "Tìm kiếm trong danh sách...";
    search.setAttribute("aria-label", "Tìm kiếm trong danh sách");

    const add = document.createElement("a");
    add.className = "medicare-button";
    add.href = adminBase + "add/";
    add.textContent = "Thêm mới";

    const manage = document.createElement("a");
    manage.className = "medicare-button secondary";
    manage.href = adminBase;
    manage.textContent = "Quản lý dữ liệu";

    toolbar.append(search, add, manage);
    panel.insertBefore(toolbar, scroll);

    const tbody = table.querySelector("tbody");
    const rows = tbody ? Array.from(tbody.querySelectorAll("tr")) : [];

    // Các trang danh sách hiện có cột ID đầu tiên.
    const headers = table.querySelector("thead tr");
    const idHeader = headers && headers.querySelector("th");
    const hasId = idHeader && /^(id|stt)$/i.test(idHeader.textContent.trim());

    if (hasId && headers) {
        const actionHeader = document.createElement("th");
        actionHeader.textContent = "Thao tác";
        headers.appendChild(actionHeader);

        rows.forEach(function (row) {
            const first = row.querySelector("td");
            const id = first ? first.textContent.trim() : "";

            const cell = document.createElement("td");
            if (/^\d+$/.test(id)) {
                const actions = document.createElement("div");
                actions.className = "medicare-actions";

                const edit = document.createElement("a");
                edit.className = "medicare-button secondary";
                edit.href = adminBase + id + "/change/";
                edit.textContent = "Sửa";

                const del = document.createElement("a");
                del.className = "medicare-button danger";
                del.href = adminBase + id + "/delete/";
                del.textContent = "Xóa";

                actions.append(edit, del);
                cell.appendChild(actions);
            }
            row.appendChild(cell);
        });
    }

    const message = document.createElement("div");
    message.className = "medicare-empty";
    message.textContent = "Không tìm thấy kết quả phù hợp.";
    message.hidden = true;
    scroll.parentElement.appendChild(message);

    search.addEventListener("input", function () {
        const term = search.value.toLocaleLowerCase("vi").trim();
        let visible = 0;

        rows.forEach(function (row) {
            const cells = Array.from(row.querySelectorAll("td"));
            const content = cells.slice(0, hasId ? -1 : undefined)
                .map(cell => cell.textContent)
                .join(" ")
                .toLocaleLowerCase("vi");

            const match = content.includes(term);
            row.hidden = !match;
            if (match) visible++;
        });

        message.hidden = visible !== 0;
    });
});
</script>

</body></html>
